
name: Website Run

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website-runs:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: NatApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NatApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build Expo website
        run: npx expo export --platform web
